[DriverFilter.Classes]
AudioProcessing.Message=Inclui objetos de processamento de áudio (APO). Para mais informações, veja Windows Audio Processing Objects.
Battery.Devices.UPS.Label=Inclui dispositivos de bateria e de UPS.
Windows.Message=(Windows Server 2003 e versões posteriores) Inclui todos os dispositivos de identificação pessoal baseados em biometria.
Windows.Label=(Windows XP SP1 e versões posteriores) Inclui todos os dispositivos Bluetooth.
Camera.Message=(Windows 10 versão 1709 e versões posteriores) Inclui controladores de câmara universais.
Cd.Rom.Drives.Message=Inclui unidades de CD-ROM, incluindo unidades de CD-ROM SCSI. Por predefinição, o instalador de classe de CD-ROM do sistema também instala um controlador de áudio de CD e um controlador de mudador de CD-ROM fornecidos pelo sistema como filtros Plug and Play.
Hard.Disk.Drives.Label=Inclui unidades de disco rígido. Ver também as classes HDC e SCSIAdapter.
VideoAdapters.Message=Inclui adaptadores de vídeo. Os controladores desta classe incluem controladores de ecrã e controladores de miniporta de vídeo.
Extension.Message=(Windows 10 e versões posteriores) Inclui todos os dispositivos que requerem personalizações. Para mais informações, veja Using an Extension INF File.
Floppy.Disk.Drive.Label=Inclui controladores de unidades de disquete.
Floppy.Disk.Drives.Label=Inclui unidades de disquete.
Includes.Hard.Message=Inclui controladores de disco rígido, incluindo controladores ATA/ATAPI mas não controladores de disco SCSI e RAID.
InputDevices.Message=Inclui dispositivos de entrada interativos operados pelo controlador de classe HID fornecido pelo sistema. Inclui dispositivos USB que cumprem a norma USB HID e dispositivos não USB que usam um minidriver HID. Para mais informações, veja HIDClass Device Setup Class. Veja também as classes Keyboard ou Mouse.
ControlDevices.Message=Inclui dispositivos que controlam o funcionamento de dispositivos periféricos multifunção IEEE 1284.4.
Dot.Print.Functions.Message=Inclui funções de impressão Dot4. Uma função de impressão Dot4 é uma função num dispositivo Dot4 e tem um único dispositivo secundário, que é membro da classe de instalação de dispositivo Printer.
Ieeedevices.Support.Message=Inclui dispositivos IEEE 1394 que suportam a classe de dispositivo de protocolo IEC-61883. O componente 61883 inclui o controlador de protocolo 61883.sys que transmite vários fluxos de dados de áudio e vídeo através do barramento 1394. Estes atualmente incluem DV de qualidade padrão/alta/baixa, MPEG2, DSS e Audio. As especificações IEC-61883 definem estes fluxos de dados.
Ieeedevices.Support.Label=Inclui dispositivos IEEE 1394 que suportam a classe de dispositivo de protocolo AVC.
SBP2.Message=Inclui dispositivos IEEE 1394 que suportam a classe de dispositivo de protocolo SBP2.
HostControllers.Message=Inclui controladores de anfitrião 1394 ligados num barramento PCI, mas não periféricos 1394. Os controladores desta classe são fornecidos pelo sistema.
Still.Image.Capture.Label=Inclui dispositivos de captura de imagem fixa, câmaras digitais e scanners.
InfraredDevices.Message=Inclui dispositivos infravermelhos. Os controladores desta classe incluem miniportas NDIS Serial-IR e Fast-IR, mas veja também a classe Adaptador de Rede para outras miniportas de adaptador de rede NDIS.
Keyboards.Message=Inclui todos os teclados. Ou seja, também deve ser especificado no INF (secundário) para um dispositivo de teclado HID secundário enumerado.
ScsimediaChanger.Label=Inclui dispositivos de mudança de suportes SCSI.
Memory.Devices.Such.Label=Inclui dispositivos de memória, como cartões de memória flash.
Modem.Devices.INF.Message=Inclui dispositivos de modem. Um ficheiro INF para um dispositivo desta classe especifica as características e configuração do dispositivo e armazena estas informações no registo. Um ficheiro INF para um dispositivo desta classe também pode ser usado para instalar controladores de dispositivo para um modem sem controlador ou um modem de software. Estes dispositivos dividem a funcionalidade entre o dispositivo de modem e o controlador de dispositivo. Para mais informações sobre ficheiros INF de modem e dispositivos de modem Microsoft Windows Driver Model (WDM), veja Overview of Modem INF Files e Adding WDM Modem Support.
Display.Monitors.INF.Message=Inclui monitores de ecrã. Um INF para um dispositivo desta classe não instala controladores de dispositivo, mas especifica antes as características de um monitor específico a armazenar no registo para uso por controladores de adaptadores de vídeo. (Os monitores são enumerados como dispositivos secundários dos adaptadores de ecrã.)
Mouse.Devices.Message=Inclui todos os dispositivos de rato e outros tipos de dispositivos apontadores, como trackballs. Ou seja, esta classe também deve ser especificada no INF (secundário) para um dispositivo de rato HID secundário enumerado.
Combo.Cards.Such.Message=Inclui placas combo, como um adaptador de modem e placa de rede PCMCIA. O controlador para tal dispositivo multifunção Plug and Play é instalado sob esta classe e enumera o modem e a placa de rede separadamente como seus dispositivos secundários.
Audio.Dvdmultimedia.Message=Inclui dispositivos multimédia de áudio e DVD, portas de joystick e dispositivos de captura de vídeo de movimento total.
MultiportSerial.Message=Inclui placas série multiporta inteligentes, mas não dispositivos periféricos que se ligam às suas portas. Não inclui controladores série multiporta não inteligentes (tipo 16550) nem controladores série de porta única (veja a classe Ports).
NetworkAdapter.Message=Consiste em controladores de adaptador de rede. Estes controladores devem chamar NdisMRegisterMiniportDriver ou NetAdapterCreate. Os controladores que não usam NDIS ou NetAdapter devem usar uma classe de instalação diferente.
Includes.Network.Message=Inclui provedores de rede e/ou impressão. Os componentes NetClient estão obsoletos no Windows 8.1, Windows Server 2012 R2 e posteriores.
Network.Services.Such.Label=Inclui serviços de rede, como redirecionadores e servidores.
NdisprotocolsCo.Message=Inclui protocolos NDIS, gestores de chamadas autónomos CoNDIS e clientes CoNDIS, além de controladores de nível superior em pilhas de transporte.
SecureDevices.Message=Inclui dispositivos que aceleram o processamento criptográfico secure socket layer (SSL).
PcmciacardBus.Message=Inclui controladores de anfitrião PCMCIA e CardBus, mas não periféricos PCMCIA ou CardBus. Os controladores desta classe são fornecidos pelo sistema.
Serial.Parallel.Port.Message=Inclui dispositivos de porta série e paralela. Ver também a classe MultiportSerial.
Printers.Admin.Hit.Label=Inclui impressoras. Como administrador de TI, dê-lhes uma tacada de basebol.
Includes.SCSI.Message=Inclui impressoras enumeradas por SCSI/1394. Os controladores desta classe fornecem comunicação de impressora para um barramento específico.
ProcessorTypes.Label=Inclui tipos de processador.
ScsihostBus.Message=Inclui adaptadores de barramento de anfitrião SCSI (HBA), matrizes de disco e controladores NVMe.
Includes.Trusted.Message=Inclui chips Trusted Platform Module. Um TPM é um criptoprocessador seguro que o ajuda em ações como gerar, armazenar e limitar o uso de chaves criptográficas. Qualquer novo dispositivo fabricado deve implementar e ativar TPM 2.0 por predefinição. Para mais informações, veja TPM Recommendations.
Includes.Sensor.Label=Inclui dispositivos de sensor e localização, como dispositivos GPS.
Smart.Card.Readers.Label=Inclui leitores de cartões inteligentes.
Virtual.Child.Device.Message=Inclui dispositivo secundário virtual para encapsular componentes de software. Para mais informações, veja Adding Software Components with an INF file.
Storage.Disks.Label=Discos de armazenamento que utilizam uma pilha de armazenamento multifila.
Includes.Storage.Message=Inclui volumes de armazenamento tal como definidos pelo gestor de volumes lógicos fornecido pelo sistema e controladores de classe que criam objetos de dispositivo para representar volumes de armazenamento, como o controlador de classe de disco do sistema.
HalsSystem.Message=Inclui HALs, barramentos de sistema, pontes de sistema, o controlador ACPI do sistema e o controlador do gestor de volumes do sistema.
