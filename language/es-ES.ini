[DriverFilter.Classes]
AudioProcessing.Message=Incluye objetos de procesamiento de audio (APO). Para obtener más información, consulte Windows Audio Processing Objects.
Battery.Devices.UPS.Label=Incluye dispositivos de batería y de SAI.
Windows.Message=(Windows Server 2003 y versiones posteriores) Incluye todos los dispositivos de identificación personal basados en biometría.
Windows.Label=(Windows XP SP1 y versiones posteriores) Incluye todos los dispositivos Bluetooth.
Camera.Message=(Windows 10 versión 1709 y versiones posteriores) Incluye controladores de cámara universales.
Cd.Rom.Drives.Message=Incluye unidades de CD-ROM, incluidas las unidades de CD-ROM SCSI. De forma predeterminada, el instalador de clase CD-ROM del sistema también instala un controlador de audio de CD y un controlador de cambiador de CD-ROM proporcionados por el sistema como filtros Plug and Play.
Hard.Disk.Drives.Label=Incluye unidades de disco duro. Consulte también las clases HDC y SCSIAdapter.
VideoAdapters.Message=Incluye adaptadores de video. Los controladores de esta clase incluyen controladores de pantalla y controladores de miniporte de video.
Extension.Message=(Windows 10 y versiones posteriores) Incluye todos los dispositivos que requieren personalizaciones. Para obtener más información, consulte Using an Extension INF File.
Floppy.Disk.Drive.Label=Incluye controladores de unidades de disquete.
Floppy.Disk.Drives.Label=Incluye unidades de disquete.
Includes.Hard.Message=Incluye controladores de disco duro, incluidos los controladores ATA/ATAPI, pero no los controladores de disco SCSI y RAID.
InputDevices.Message=Incluye dispositivos de entrada interactivos operados por el controlador de clase HID proporcionado por el sistema. Incluye dispositivos USB que cumplen con el estándar USB HID y dispositivos no USB que usan un minicontrolador HID. Para obtener más información, consulte HIDClass Device Setup Class. Consulte también las clases Keyboard o Mouse.
ControlDevices.Message=Incluye dispositivos que controlan el funcionamiento de dispositivos periféricos multifunción IEEE 1284.4.
Dot.Print.Functions.Message=Incluye funciones de impresión Dot4. Una función de impresión Dot4 es una función de un dispositivo Dot4 y tiene un único dispositivo secundario, que es miembro de la clase de instalación de dispositivo Printer.
Ieeedevices.Support.Message=Incluye dispositivos IEEE 1394 compatibles con la clase de dispositivo de protocolo IEC-61883. El componente 61883 incluye el controlador de protocolo 61883.sys que transmite varios flujos de datos de audio y video a través del bus 1394. Actualmente incluyen DV de calidad estándar/alta/baja, MPEG2, DSS y Audio. Las especificaciones IEC-61883 definen estos flujos de datos.
Ieeedevices.Support.Label=Incluye dispositivos IEEE 1394 compatibles con la clase de dispositivo de protocolo AVC.
SBP2.Message=Incluye dispositivos IEEE 1394 compatibles con la clase de dispositivo de protocolo SBP2.
HostControllers.Message=Incluye controladores host 1394 conectados en un bus PCI, pero no periféricos 1394. Los controladores de esta clase los proporciona el sistema.
Still.Image.Capture.Label=Incluye dispositivos de captura de imágenes fijas, cámaras digitales y escáneres.
InfraredDevices.Message=Incluye dispositivos de infrarrojos. Los controladores de esta clase incluyen miniportes NDIS Serial-IR y Fast-IR, pero consulte también la clase Adaptador de red para otros miniportes de adaptador de red NDIS.
Keyboards.Message=Incluye todos los teclados. Es decir, también debe especificarse en el INF (secundario) de un dispositivo de teclado HID secundario enumerado.
ScsimediaChanger.Label=Incluye dispositivos cambiadores de medios SCSI.
Memory.Devices.Such.Label=Incluye dispositivos de memoria, como tarjetas de memoria flash.
Modem.Devices.INF.Message=Incluye dispositivos de módem. Un archivo INF para un dispositivo de esta clase especifica las características y la configuración del dispositivo y almacena esta información en el registro. Un archivo INF para un dispositivo de esta clase también se puede usar para instalar controladores de dispositivo para un módem sin controlador o un módem por software. Estos dispositivos dividen la funcionalidad entre el dispositivo de módem y el controlador de dispositivo. Para obtener más información sobre archivos INF de módem y dispositivos de módem Microsoft Windows Driver Model (WDM), consulte Overview of Modem INF Files y Adding WDM Modem Support.
Display.Monitors.INF.Message=Incluye monitores de pantalla. Un INF para un dispositivo de esta clase no instala controladores de dispositivo, sino que especifica las características de un monitor particular que se almacenarán en el registro para su uso por los controladores de adaptadores de video. (Los monitores se enumeran como dispositivos secundarios de los adaptadores de pantalla.)
Mouse.Devices.Message=Incluye todos los dispositivos de mouse y otros tipos de dispositivos señaladores, como trackballs. Es decir, esta clase también debe especificarse en el INF (secundario) de un dispositivo de mouse HID secundario enumerado.
Combo.Cards.Such.Message=Incluye tarjetas combo, como un adaptador de módem y tarjeta de red PCMCIA. El controlador de dicho dispositivo multifunción Plug and Play se instala bajo esta clase y enumera el módem y la tarjeta de red por separado como sus dispositivos secundarios.
Audio.Dvdmultimedia.Message=Incluye dispositivos multimedia de audio y DVD, puertos de joystick y dispositivos de captura de video de movimiento completo.
MultiportSerial.Message=Incluye tarjetas serie multipuerto inteligentes, pero no dispositivos periféricos que se conecten a sus puertos. No incluye controladores serie multipuerto no inteligentes (tipo 16550) ni controladores serie de un solo puerto (consulte la clase Ports).
NetworkAdapter.Message=Consiste en controladores de adaptador de red. Estos controladores deben llamar a NdisMRegisterMiniportDriver o NetAdapterCreate. Los controladores que no usan NDIS o NetAdapter deben usar una clase de instalación diferente.
Includes.Network.Message=Incluye proveedores de red y/o de impresión. Los componentes NetClient están en desuso en Windows 8.1, Windows Server 2012 R2 y versiones posteriores.
Network.Services.Such.Label=Incluye servicios de red, como redirectores y servidores.
NdisprotocolsCo.Message=Incluye protocolos NDIS, administradores de llamadas independientes CoNDIS y clientes CoNDIS, además de controladores de nivel superior en pilas de transporte.
SecureDevices.Message=Incluye dispositivos que aceleran el procesamiento criptográfico de capa de sockets seguros (SSL).
PcmciacardBus.Message=Incluye controladores host PCMCIA y CardBus, pero no periféricos PCMCIA o CardBus. Los controladores de esta clase los proporciona el sistema.
Serial.Parallel.Port.Message=Incluye dispositivos de puerto serie y paralelo. Consulte también la clase MultiportSerial.
Printers.Admin.Hit.Label=Incluye impresoras. Como administrador de TI, dales con un bate de béisbol.
Includes.SCSI.Message=Incluye impresoras enumeradas por SCSI/1394. Los controladores de esta clase proporcionan comunicación de impresora para un bus específico.
ProcessorTypes.Label=Incluye tipos de procesador.
ScsihostBus.Message=Incluye adaptadores de bus host SCSI (HBA), matrices de discos y controladores NVMe.
Includes.Trusted.Message=Incluye chips de módulo de plataforma segura (TPM). Un TPM es un criptoprocesador seguro que le ayuda con acciones como generar, almacenar y limitar el uso de claves criptográficas. Todo dispositivo nuevo fabricado debe implementar y habilitar TPM 2.0 de forma predeterminada. Para obtener más información, consulte TPM Recommendations.
Includes.Sensor.Label=Incluye dispositivos de sensores y ubicación, como dispositivos GPS.
