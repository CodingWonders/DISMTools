ScsimediaChanger.Label=Inclut les périphériques de changement de support SCSI.
Memory.Devices.Such.Label=Inclut les périphériques de mémoire, tels que les cartes mémoire flash.
Modem.Devices.INF.Message=Inclut les périphériques modem. Un fichier INF pour un périphérique de cette classe spécifie les caractéristiques et la configuration du périphérique et stocke ces informations dans le registre. Un fichier INF pour un périphérique de cette classe peut également être utilisé pour installer des pilotes de périphérique pour un modem sans contrôleur ou un modem logiciel. Ces périphériques répartissent la fonctionnalité entre le périphérique modem et le pilote de périphérique. Pour plus d'informations sur les fichiers INF de modem et les périphériques modem Microsoft Windows Driver Model (WDM), voir Overview of Modem INF Files et Adding WDM Modem Support.
Display.Monitors.INF.Message=Inclut les moniteurs d'affichage. Un fichier INF pour un périphérique de cette classe n'installe aucun pilote de périphérique, mais spécifie plutôt les caractéristiques d'un moniteur particulier à stocker dans le registre pour être utilisées par les pilotes des adaptateurs vidéo. (Les moniteurs sont énumérés comme périphériques enfants des adaptateurs d'affichage.)
Mouse.Devices.Message=Inclut tous les périphériques de souris et autres types de périphériques de pointage, tels que les trackballs. C'est-à-dire que cette classe doit également être spécifiée dans le fichier INF (secondaire) pour un périphérique souris HID enfant énuméré.
Combo.Cards.Such.Message=Inclut les cartes combo, telles qu'un adaptateur modem et carte réseau PCMCIA. Le pilote d'un tel périphérique multifonction Plug and Play est installé sous cette classe et énumère séparément le modem et la carte réseau comme ses périphériques enfants.
Audio.Dvdmultimedia.Message=Inclut les périphériques multimédias audio et DVD, les ports de manette de jeu et les périphériques de capture vidéo plein mouvement.
MultiportSerial.Message=Inclut les cartes série multiport intelligentes, mais pas les périphériques qui se connectent à ses ports. N'inclut pas les contrôleurs série multiport non intelligents (type 16550) ni les contrôleurs série monoport (voir la classe Ports).
NetworkAdapter.Message=Se compose de pilotes d'adaptateur réseau. Ces pilotes doivent soit appeler NdisMRegisterMiniportDriver, soit NetAdapterCreate. Les pilotes qui n'utilisent pas NDIS ou NetAdapter doivent utiliser une classe d'installation différente.
Includes.Network.Message=Inclut les fournisseurs réseau et/ou d'impression. Les composants NetClient sont obsolètes dans Windows 8.1, Windows Server 2012 R2 et versions ultérieures.
Network.Services.Such.Label=Inclut les services réseau, tels que les redirecteurs et les serveurs.
NdisprotocolsCo.Message=Inclut les protocoles NDIS, les gestionnaires d'appels autonomes CoNDIS et les clients CoNDIS, en plus des pilotes de niveau supérieur dans les piles de transport.
SecureDevices.Message=Inclut les périphériques qui accélèrent le traitement cryptographique de la couche de sockets sécurisée (SSL).
PcmciacardBus.Message=Inclut les contrôleurs hôtes PCMCIA et CardBus, mais pas les périphériques PCMCIA ou CardBus. Les pilotes de cette classe sont fournis par le système.
Serial.Parallel.Port.Message=Inclut les périphériques de port série et parallèle. Voir aussi la classe MultiportSerial.
Printers.Admin.Hit.Label=Inclut les imprimantes. En tant qu'administrateur informatique, frappez-les avec une batte de baseball.
Includes.SCSI.Message=Inclut les imprimantes énumérées par SCSI/1394. Les pilotes de cette classe fournissent la communication d'imprimante pour un bus spécifique.
ProcessorTypes.Label=Inclut les types de processeurs.
ScsihostBus.Message=Inclut les adaptateurs de bus hôte SCSI (HBA), les baies de disques et les contrôleurs NVMe.
Includes.Trusted.Message=Inclut les puces Trusted Platform Module. Un TPM est un cryptoprocesseur sécurisé qui vous aide dans des actions telles que la génération, le stockage et la limitation de l'utilisation des clés cryptographiques. Tout nouveau périphérique fabriqué doit implémenter et activer TPM 2.0 par défaut. Pour plus d'informations, voir TPM Recommendations.
Includes.Sensor.Label=Inclut les capteurs et périphériques de localisation, tels que les dispositifs GPS.
Smart.Card.Readers.Label=Inclut les lecteurs de cartes à puce.
Virtual.Child.Device.Message=Inclut un périphérique enfant virtuel pour encapsuler des composants logiciels. Pour plus d'informations, voir Adding Software Components with an INF file.
Storage.Disks.Label=Disques de stockage utilisant une pile de stockage multifile.
Includes.Storage.Message=Inclut les volumes de stockage tels que définis par le gestionnaire de volumes logiques fourni par le système et les pilotes de classe qui créent des objets de périphérique pour représenter les volumes de stockage, tels que le pilote de classe de disque système.
HalsSystem.Message=Inclut les HAL, les bus système, les ponts système, le pilote ACPI du système et le pilote du gestionnaire de volumes système.
Tape.Drives.Including.Label=Inclut les lecteurs de bande, y compris tous les pilotes de miniclasse de bande.
Usbdevice.Includes.Message=USBDevice inclut tous les périphériques USB qui n'appartiennent pas à une autre classe. Cette classe n'est pas utilisée pour les contrôleurs hôtes USB et les concentrateurs ; les pilotes de ces périphériques sont fournis par le système d'exploitation et doivent utiliser la classe USB décrite dans System-Defined Device Setup Classes Reserved for System Use.
WindowsCeactive.Message=Inclut les périphériques Windows CE ActiveSync. La classe d'installation WCEUSBS prend en charge la communication entre un ordinateur personnel et un périphérique compatible avec le pilote Windows CE ActiveSync (généralement, les périphériques PocketPC) via USB.
Wpddevices.Label=Inclut les périphériques WPD.

