Introduction.Message=Dans le monde de l'administration système, le partage des connaissances est essentiel. Si vous pensez que ce script de démarrage peut aider d'autres personnes, vous pouvez le téléverser vers la bibliothèque de scripts de démarrage pour que des personnes du monde entier puissent l'essayer.{crlf;}{crlf;}Vous devez avoir un compte GitHub pour pouvoir téléverser des scripts de démarrage vers la bibliothèque.
SignUp.Link=Si vous n'avez pas de compte GitHub, cliquez ici pour vous inscrire.
ApiKeyExplanation.Message=En continuant le téléversement de ce script de démarrage, vous créerez une pull request pour le référentiel de la bibliothèque. Pour que ce processus soit le plus automatisé possible, vous devez fournir à l'éditeur de scripts de démarrage une clé API GitHub.
ApiKey.Label=Clé API GitHub:{space;}
GetApiKey.Link=Comment obtenir une clé API ?
PrivacyWarning.Message=Vérifiez que votre script de démarrage ne contient aucune information permettant de vous identifier ou d'identifier des personnes que vous connaissez dans la vie réelle, ni d'accéder à des ressources internes d'une organisation.{crlf;}{crlf;}Fermez cette boîte de dialogue et vérifiez le contenu de votre script de démarrage pour toute information personnellement identifiable avant de téléverser le script.
AllowUse.CheckBox=J'autorise ce script de démarrage à être utilisé par des personnes du monde entier
AcknowledgeRisk.CheckBox=Je reconnais les risques liés au téléversement d'un script de démarrage contenant des informations identifiables, et j'ai vérifié qu'il n'y avait pas de telles informations
