CreationHelp.Message=L'assistant de création de fichier de réponses sans assistance vous permet de créer des fichiers de réponses sans assistance à l'aide d'interfaces intuitives. Cet assistant convient aux personnes qui n'ont jamais créé de fichiers de réponses sans assistance auparavant ou qui ne veulent pas utiliser un éditeur de texte.{crlf;}{crlf;}Dans cet assistant, vous pourrez configurer les paramètres régionaux, les comptes utilisateur, les paramètres sans fil, la prise en charge des machines virtuelles, et plus encore. Si vous devez ajouter plus de fonctionnalités à votre fichier après sa création, vous pouvez utiliser le mode Éditeur, auquel vous pouvez accéder en cliquant sur le bouton en bas à gauche.{crlf;}{crlf;}Remerciements spéciaux à Christoph Schneegans pour avoir créé la bibliothèque qui rend cet assistant possible. Vous pouvez également utiliser son site Web générateur pour configurer plus de paramètres, comme des ajustements ou des règles Windows Defender Application Control.{crlf;}{crlf;}{crlf;}Pour commencer à créer votre fichier de réponses, cliquez sur Suivant.
