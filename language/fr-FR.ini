PreventLeaks.Message=Si votre script de démarrage contient des informations confidentielles, vous pouvez éviter leur fuite en effectuant l'une des actions suivantes:{crlf;}- N'incluez pas de mots de passe, clés API, tokens ou autres identifiants directement dans les scripts avant le téléversement{crlf;}- Supprimez les informations système sensibles telles que les noms d'utilisateur, les noms d'ordinateur, les adresses de serveur internes, les partages réseau et les chemins de fichiers locaux des scripts{crlf;}- Vérifiez les scripts pour détecter les commandes exposant des données confidentielles, telles que les exportations de registre, les vidages de variables d'environnement, ou les instructions de journalisation/sortie contenant des informations sensibles
