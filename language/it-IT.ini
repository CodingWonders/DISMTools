Responsibility.Message=Lo strumento di preparazione Sysprep, responsabile della preparazione dei sistemi per l'acquisizione di immagini, può operare in 2 modalità: Modalità automatica e Modalità manuale.{crlf;}{crlf;}- La modalità automatica esegue verifiche e, se tali verifiche vengono superate, prepara e generalizza automaticamente il computer. Non è necessario interagire con lo strumento, a meno che le verifiche non falliscano o si completino con avvisi. Verrà usato anche un set predefinito di opzioni per Sysprep{crlf;}- La modalità manuale consente di configurare le impostazioni di avvio di Sysprep e di percorrere ogni passaggio dello strumento al proprio ritmo. Consigliato per utenti avanzati{crlf;}{crlf;}Seleziona la modalità che vuoi usare:{space;}
