[DriverFilter.Classes]
AudioProcessing.Message=Include gli oggetti di elaborazione audio (APO). Per ulteriori informazioni, vedi Windows Audio Processing Objects.
Battery.Devices.UPS.Label=Include i dispositivi batteria e UPS.
Windows.Message=(Windows Server 2003 e versioni successive) Include tutti i dispositivi di identificazione personale basati su biometria.
Windows.Label=(Windows XP SP1 e versioni successive) Include tutti i dispositivi Bluetooth.
Camera.Message=(Windows 10 versione 1709 e versioni successive) Include i driver universali per fotocamera.
Cd.Rom.Drives.Message=Include le unità CD-ROM, incluse le unità CD-ROM SCSI. Per impostazione predefinita, l'installatore di classe CD-ROM del sistema installa anche un driver audio CD e un driver cambia CD-ROM forniti dal sistema come filtri Plug and Play.
Hard.Disk.Drives.Label=Include le unità disco rigido. Vedi anche le classi HDC e SCSIAdapter.
VideoAdapters.Message=Include gli adattatori video. I driver di questa classe includono driver di visualizzazione e driver di miniporta video.
Extension.Message=(Windows 10 e versioni successive) Include tutti i dispositivi che richiedono personalizzazioni. Per ulteriori informazioni, vedi Using an Extension INF File.
Floppy.Disk.Drive.Label=Include i controller delle unità disco floppy.
Floppy.Disk.Drives.Label=Include le unità disco floppy.
Includes.Hard.Message=Include i controller del disco rigido, inclusi i controller ATA/ATAPI ma non i controller di disco SCSI e RAID.
InputDevices.Message=Include i dispositivi di input interattivi gestiti dal driver di classe HID fornito dal sistema. Include i dispositivi USB conformi allo standard USB HID e i dispositivi non USB che usano un minidriver HID. Per ulteriori informazioni, vedi HIDClass Device Setup Class. Vedi anche le classi Keyboard o Mouse.
ControlDevices.Message=Include i dispositivi che controllano il funzionamento dei dispositivi periferici multifunzione IEEE 1284.4.
Dot.Print.Functions.Message=Include le funzioni di stampa Dot4. Una funzione di stampa Dot4 è una funzione su un dispositivo Dot4 e ha un singolo dispositivo secondario, che è membro della classe di installazione dispositivo Printer.
Ieeedevices.Support.Message=Include i dispositivi IEEE 1394 che supportano la classe di dispositivi con protocollo IEC-61883. Il componente 61883 include il driver di protocollo 61883.sys che trasmette vari flussi di dati audio e video sul bus 1394. Questi attualmente includono DV di qualità standard/alta/bassa, MPEG2, DSS e Audio. Le specifiche IEC-61883 definiscono questi flussi di dati.
Ieeedevices.Support.Label=Include i dispositivi IEEE 1394 che supportano la classe di dispositivi con protocollo AVC.
SBP2.Message=Include i dispositivi IEEE 1394 che supportano la classe di dispositivi con protocollo SBP2.
HostControllers.Message=Include i controller host 1394 connessi su un bus PCI, ma non le periferiche 1394. I driver di questa classe sono forniti dal sistema.
Still.Image.Capture.Label=Include dispositivi di acquisizione immagini fisse, fotocamere digitali e scanner.
InfraredDevices.Message=Include i dispositivi a infrarossi. I driver di questa classe includono i miniporti NDIS Serial-IR e Fast-IR, ma vedi anche la classe Adattatore di rete per altri miniporti di adattatore di rete NDIS.
Keyboards.Message=Include tutte le tastiere. Cioè, deve anche essere specificato nell'INF (secondario) per un dispositivo tastiera HID secondario enumerato.
ScsimediaChanger.Label=Include i dispositivi cambia supporti SCSI.
Memory.Devices.Such.Label=Include i dispositivi di memoria, come le schede di memoria flash.
Modem.Devices.INF.Message=Include i dispositivi modem. Un file INF per un dispositivo di questa classe specifica le caratteristiche e la configurazione del dispositivo e archivia queste informazioni nel registro. Un file INF per un dispositivo di questa classe può anche essere usato per installare driver di dispositivo per un modem senza controller o un modem software. Questi dispositivi suddividono la funzionalità tra il dispositivo modem e il driver di dispositivo. Per ulteriori informazioni sui file INF per modem e sui dispositivi modem Microsoft Windows Driver Model (WDM), vedi Overview of Modem INF Files e Adding WDM Modem Support.
Display.Monitors.INF.Message=Include i monitor di visualizzazione. Un INF per un dispositivo di questa classe non installa driver di dispositivo, ma specifica invece le caratteristiche di un particolare monitor da archiviare nel registro per l'uso da parte dei driver degli adattatori video. (I monitor sono enumerati come dispositivi secondari degli adattatori video.)
Mouse.Devices.Message=Include tutti i dispositivi mouse e altri tipi di dispositivi di puntamento, come i trackball. Cioè, questa classe deve anche essere specificata nell'INF (secondario) per un dispositivo mouse HID secondario enumerato.
Combo.Cards.Such.Message=Include le schede combo, come un adattatore modem e scheda di rete PCMCIA. Il driver per tale dispositivo multifunzione Plug and Play viene installato sotto questa classe ed enumera separatamente il modem e la scheda di rete come suoi dispositivi secondari.
Audio.Dvdmultimedia.Message=Include i dispositivi multimediali audio e DVD, le porte joystick e i dispositivi di acquisizione video a movimento completo.
MultiportSerial.Message=Include le schede seriali multiporta intelligenti, ma non i dispositivi periferici che si connettono alle sue porte. Non include i controller seriali multiporta non intelligenti (tipo 16550) né i controller seriali a porta singola (vedi la classe Ports).
NetworkAdapter.Message=Consiste di driver dell'adattatore di rete. Questi driver devono chiamare NdisMRegisterMiniportDriver o NetAdapterCreate. I driver che non usano NDIS o NetAdapter dovrebbero usare una classe di installazione diversa.
Includes.Network.Message=Include i provider di rete e/o di stampa. I componenti NetClient sono deprecati in Windows 8.1, Windows Server 2012 R2 e versioni successive.
Network.Services.Such.Label=Include i servizi di rete, come reindirizzatori e server.
NdisprotocolsCo.Message=Include i protocolli NDIS, i gestori di chiamate autonomi CoNDIS e i client CoNDIS, oltre ai driver di livello superiore negli stack di trasporto.
SecureDevices.Message=Include i dispositivi che accelerano l'elaborazione crittografica secure socket layer (SSL).
PcmciacardBus.Message=Include i controller host PCMCIA e CardBus, ma non le periferiche PCMCIA o CardBus. I driver di questa classe sono forniti dal sistema.
Serial.Parallel.Port.Message=Include i dispositivi con porta seriale e parallela. Vedi anche la classe MultiportSerial.
Printers.Admin.Hit.Label=Include le stampanti. Come amministratore IT, colpiscile con una mazza da baseball.
Includes.SCSI.Message=Include le stampanti enumerate SCSI/1394. I driver di questa classe forniscono la comunicazione della stampante per un bus specifico.
ProcessorTypes.Label=Include i tipi di processore.
ScsihostBus.Message=Include gli adattatori bus host SCSI (HBA), gli array di dischi e i controller NVMe.
Includes.Trusted.Message=Include i chip Trusted Platform Module. Un TPM è un crittoprocessore sicuro che ti assiste in azioni come la generazione, l'archiviazione e la limitazione dell'uso di chiavi crittografiche. Qualsiasi nuovo dispositivo fabbricato deve implementare e abilitare TPM 2.0 per impostazione predefinita. Per ulteriori informazioni, vedi TPM Recommendations.
Includes.Sensor.Label=Include i dispositivi sensore e di localizzazione, come i dispositivi GPS.
Smart.Card.Readers.Label=Include i lettori di smart card.
Virtual.Child.Device.Message=Include un dispositivo secondario virtuale per incapsulare componenti software. Per ulteriori informazioni, vedi Adding Software Components with an INF file.
Storage.Disks.Label=Dischi di archiviazione che utilizzano uno stack di archiviazione multi-coda.
Includes.Storage.Message=Include i volumi di archiviazione come definiti dal gestore di volumi logici fornito dal sistema e dai driver di classe che creano oggetti dispositivo per rappresentare i volumi di archiviazione, come il driver di classe del disco di sistema.
HalsSystem.Message=Include HAL, bus di sistema, bridge di sistema, il driver ACPI di sistema e il driver del gestore dei volumi di sistema.
Tape.Drives.Including.Label=Include le unità nastro, inclusi tutti i driver di miniclasse nastro.
Usbdevice.Includes.Message=USBDevice include tutti i dispositivi USB che non appartengono a un'altra classe. Questa classe non è usata per i controller host USB e i hub; i driver per questi dispositivi sono forniti dal sistema operativo e dovrebbero usare la classe USB descritta in System-Defined Device Setup Classes Reserved for System Use.
WindowsCeactive.Message=Include i dispositivi Windows CE ActiveSync. La classe di installazione WCEUSBS supporta la comunicazione tra un computer personale e un dispositivo compatibile con il driver Windows CE ActiveSync (generalmente, dispositivi PocketPC) tramite USB.
Wpddevices.Label=Include i dispositivi WPD.

