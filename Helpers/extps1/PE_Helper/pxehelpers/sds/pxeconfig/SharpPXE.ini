; SharpPXE configuration
; Lines starting with ; or # are comments.
; Placeholders: {server} = this server's IP on the interface the client came in on,
;               {http}   = http://{server}[:port]   (iPXE scripts only)
;               {mac}    = client MAC as aa-bb-cc-dd-ee-ff (boot file names only)

[server]
; proxy = proxyDHCP next to your existing DHCP server (router, Windows DHCP...). No addresses handed out.
; dhcp  = full DHCP server (fill in [dhcp] below)
; off   = TFTP/HTTP only
mode=proxy
; Comma-separated local IPv4 addresses to serve on. Empty = every adapter that is up (except 169.254.x.x).
; Strongly recommended on machines with Hyper-V / VMware / Wi-Fi adapters.
bind=
; Folder that TFTP and HTTP serve (relative to SharpPXE.exe, or absolute)
root=files
tftp=1
http=1
http_port=80
; log=SharpPXE.log
verbose=0
; Create/repair the inbound Windows Firewall rule "SharpPXE" at every start (needs admin rights;
; the service always has them). Set to 0 if firewall rules are managed by Group Policy.
firewall=1

[boot]
; First stage, loaded by the firmware over TFTP. Use iPXE builds (https://ipxe.org/download).
bios=undionly.kpxe
uefi_x64=snponly-x86_64.efi
uefi_ia32=ipxe-i386.efi
uefi_arm64=snponly-arm64.efi
; UEFI HTTP Boot clients (no TFTP) get a URL instead
httpboot_x64=http://{server}/snponly-x86_64.efi
httpboot_arm64=http://{server}/snponly-arm64.efi
; Second stage: once iPXE is running it asks again and gets this script
ipxe=http://{server}/boot.ipxe

[mac]
; Per-machine iPXE script overrides, by MAC address (any separator)
; 00-15-5d-01-02-03=http://{server}/special.ipxe

[dhcp]
; Only used with mode=dhcp
; pool_start=192.168.137.100
; pool_end=192.168.137.200
; subnet=255.255.255.0
; router=192.168.137.1
; dns=192.168.137.1, 1.1.1.1
; domain=lab.local
; lease_time=3600

[tftp]
; Upper limits; the client asks and we never exceed these.
; Raise max_blksize to 8192+ only if every network hop handles IP fragments.
max_blksize=1468
max_windowsize=16
timeout_ms=1500
retries=6
